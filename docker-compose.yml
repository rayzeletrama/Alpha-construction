version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        user: devuser
        uid: ${WWWUSER:-1000}
    container_name: alpha_api
    restart: unless-stopped
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage/app/public:/var/www/html/storage/app/public
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=alpha_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
    # On ajoute une commande pour lancer le serveur de dev Laravel
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: alpha_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: alpha_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - alpha_db_data:/var/lib/postgresql/data

volumes:
  alpha_db_data:
